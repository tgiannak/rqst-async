name: CI
on:
  push:
  workflow_dispatch:

jobs:
  create-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install RepoQuest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: repo-quest
          git: https://github.com/cognitive-engineering-lab/repo-quest.git
          branch: next
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bundle quest
        run: |
          export RUST_LOG=debug
          repo-quest-bundle --output rqst-async-quest.tgz dir --input "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v6
        with:
          name: rqst-async-quest
          path: rqst-async-quest.tgz
